[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-siem"
version = "0.1.0"
description = "Mini-SIEM: ingestão, normalização, consulta e correlação de logs de segurança."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Diogo Damasceno", email = "dev.diogodamasceno@gmail.com" }]
keywords = ["security", "siem", "logs", "detection", "cybersecurity"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
minisiem = "minisiem.cli:main"

[tool.setuptools.packages.find]
include = ["minisiem*"]
